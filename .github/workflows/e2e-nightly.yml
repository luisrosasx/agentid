name: e2e-nightly

on:
  schedule:
    - cron: '7 3 * * *' # UTC; anti-herd: minuto no redondo
  workflow_dispatch:

jobs:
  e2e-fase4:
    runs-on: ubuntu-latest
    # Job diagnóstico, no gate: reporta, no bloquea merges.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E Fase 4 en vivo contra Railway
        env:
          POB_KEY: "${{ secrets.E2E_POB_KEY }}"
          E2E_SERVICE_KEY: "${{ secrets.E2E_SERVICE_KEY }}"
          E2E_HMAC_SECRET: "${{ secrets.E2E_HMAC_SECRET }}"
          E2E_OPERATOR_KEY: "${{ secrets.E2E_OPERATOR_KEY }}"
          GATEWAY: https://gateway-demo-production-6e65.up.railway.app
        run: bash e2e/e2e-fase4.sh
      - name: E2E auth-required (Fase 6)
        env:
          POB_KEY: "${{ secrets.E2E_POB_KEY }}"
          E2E_SERVICE_KEY: "${{ secrets.E2E_SERVICE_KEY }}"
          E2E_HMAC_SECRET: "${{ secrets.E2E_HMAC_SECRET }}"
          E2E_OPERATOR_KEY: "${{ secrets.E2E_OPERATOR_KEY }}"
          GATEWAY: https://gateway-demo-production-6e65.up.railway.app
        run: bash e2e/e2e-auth.sh
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          retention-days: 7
          path: |
            /tmp/*.json
            /tmp/*.log
          if-no-files-found: ignore
      - name: Abrir issue ante fallo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R luisrosasx/cardca \
            --title "e2e-nightly FAIL $(date -u +%F)" \
            --body "El job e2e-nightly falló. Ver logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  zk-adversarial:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Descargar toolchain Noir + Barretenberg (linux amd64 nativo)
        run: |
          mkdir -p /tmp/noir
          curl -sL -o /tmp/noir/noir.tar.gz https://github.com/noir-lang/noir/releases/download/v1.0.0-rc.2/noir-x86_64-unknown-linux-musl.tar.gz
          curl -sL -o /tmp/noir/bb.tar.gz https://github.com/AztecProtocol/barretenberg/releases/download/v6.0.0-rc.2/barretenberg-amd64-linux.tar.gz
          tar xzf /tmp/noir/noir.tar.gz -C /tmp/noir && chmod +x /tmp/noir/nargo
          tar xzf /tmp/noir/bb.tar.gz -C /tmp/noir && chmod +x /tmp/noir/bb
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Suite adversarial ZK (muestra 50 + espejo 10k)
        run: node zk/tests/adversarial.mjs --sample=50
      - name: Subir reporte adversarial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk-adversarial-report
          retention-days: 7
          path: zk/adversarial-report.md
